name: Build NoiseCut Studio

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  QT_QPA_PLATFORM: offscreen

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [Lite, Completa]

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar FFmpeg para las pruebas (solo atajo)
        run: choco install ffmpeg -y --no-progress

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          if ("${{ matrix.edition }}" -eq "Completa") {
            pip install -r requirements-ai.txt
          }

      - name: Generar icono
        run: python make_icon.py

      - name: Ejecutar pruebas
        run: python test_engine.py

      - name: Compilar con PyInstaller
        shell: pwsh
        run: ./build_windows.ps1 -Edition ${{ matrix.edition }}

      - name: Reemplazar FFmpeg por la build completa de BtbN
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $bin = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $dest = "dist/NoiseCutStudio/ffmpeg"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item $bin.FullName $dest
          Copy-Item (Join-Path $bin.DirectoryName "ffprobe.exe") $dest
          Write-Host "FFmpeg copiado a $dest"

      - name: Comprimir
        shell: pwsh
        run: |
          Compress-Archive -Path dist/NoiseCutStudio -DestinationPath "NoiseCutStudio-${{ matrix.edition }}.zip"
          $mb = [math]::Round((Get-Item "NoiseCutStudio-${{ matrix.edition }}.zip").Length / 1MB, 1)
          Write-Host "Tamano: $mb MB"

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: NoiseCutStudio-${{ matrix.edition }}
          path: NoiseCutStudio-${{ matrix.edition }}.zip
